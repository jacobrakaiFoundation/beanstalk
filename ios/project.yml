name: Beanstalk
options:
  bundleIdPrefix: org.jacobrakaifoundation
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  groupSortPosition: top
packages:
  BeanstalkCore:
    path: Core
configs:
  Debug: debug
  Release: release
targets:
  Beanstalk:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: BeanstalkCore
        product: BeanstalkCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.jacobrakaifoundation.beanstalk
        PRODUCT_NAME: Beanstalk
        DEVELOPMENT_TEAM: X5K96H5VRR
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 2
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
        SWIFT_VERSION: 5.9
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Beanstalk.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          APNS_ENVIRONMENT: development
        Release:
          APNS_ENVIRONMENT: production
    scheme:
      testTargets: []
      gatherCoverageData: false
