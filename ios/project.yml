name: Beanstalk
options:
  bundleIdPrefix: org.jacobrakaifoundation
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  groupSortPosition: top
packages:
  BeanstalkCore:
    path: Core
configs:
  Debug: debug
  Release: release
targets:
  Beanstalk:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: BeanstalkCore
        product: BeanstalkCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.jacobrakaifoundation.beanstalk
        PRODUCT_NAME: Beanstalk
        MARKETING_VERSION: 1.0.2
        CURRENT_PROJECT_VERSION: 5
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
        SWIFT_VERSION: 5.9
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: []
      gatherCoverageData: false
