  <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png">
  <script>
    // Apply the stored or system theme before first paint to avoid a light flash.
    try {
      const stored = localStorage.getItem("ponder_dark_mode");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (stored === "true" || (stored === null && prefersDark)) document.documentElement.classList.add("dark");
    } catch {
      /* storage unavailable */
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>
    <h1>Beanstalk — FDA Food Recall Search</h1>
    <p>Search food enforcement records as published by openFDA by product, company, or hazard. The free web app requires JavaScript for interactive search.</p>
    <p>Records are historical and may be incomplete or outdated. No search result is a determination that a product is safe.</p>
    <p><a href="%BASE_URL%about.html">About Beanstalk and funding</a> · <a href="https://www.fda.gov/safety/recalls-market-withdrawals-safety-alerts">FDA recall notices</a></p>
  </noscript>
  <script type="module" src="/src/main.tsx"></script>
