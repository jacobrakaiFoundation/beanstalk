services:
  notifications:
    build:
      context: .
    image: beanstalk-notifications:local
    restart: unless-stopped
    init: true
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      DATABASE_PATH: /data/beanstalk-notifications.sqlite
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - beanstalk-notification-data:/data
      - ./secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m

volumes:
  beanstalk-notification-data:
