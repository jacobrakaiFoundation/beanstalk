name: ci

# The workflow that runs on every push and pull request:
#
#   checks  — lint, build and test the existing React/PWA. The job name is a
#             protected-branch status context and must remain stable.
#   service — lint, test and build the notification service on Node 22.
#   native  — run the Swift tests and compile the Release app with the current
#             App Store submission toolchain.
#   android — build the Capacitor-wrapped Vite SPA and upload a debug-signed
#             sideload APK. Uses the Android debug keystore; Play upload
#             signing is not configured.
#   pr      — pull requests only. Title format, the `Closes #N` reference, the
#             template's Summary section, auto-labels, CODEOWNERS validity and
#             a grep for hardcoded secrets in the diff. No Node, no install:
#             it finishes in seconds.
#
# This replaces three workflows (ci, pr-review, Adversarial Verify) that
# together ran thirteen jobs and five `npm ci` per push, most of them repeating
# each other byte for byte. Security scanning (CodeQL, dependency review) now
# lives in security.yml, which calls the organization's reusable workflow.
#
# Actions are pinned to full commit SHAs with the version in a trailing comment,
# per the org's docs/MONITORING.md. Dependabot keeps the pins current.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: food-recall-app

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: food-recall-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint and format (biome check)
        run: npm run check

      - name: Typecheck and build
        run: npm run build

      - name: Test
        run: npm run test:coverage

  service:
    name: notification service checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.draft != true
    defaults:
      run:
        working-directory: notification-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: notification-service/package-lock.json

      - name: Install
        run: npm ci

      - name: Install and verify recovery prerequisite
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends sqlite3
          sqlite_path=$(command -v sqlite3)
          test -x "$sqlite_path"
          "$sqlite_path" --version

      - name: Validate operations scripts
        run: bash -n scripts/backup.sh scripts/restore.sh scripts/monitor.sh

      - name: Lint, test, and build
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Validate and build production container
        run: |
          docker compose config --quiet
          docker build --tag beanstalk-notifications:test .

  native:
    name: native release checks
    runs-on: macos-26
    timeout-minutes: 10
    if: github.event.pull_request.draft != true
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify App Store toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          version=$(xcodebuild -version | awk '/^Xcode / { print $2 }')
          major=${version%%.*}
          if [ -z "$major" ] || [ "$major" -lt 26 ]; then
            echo "::error::App Store builds require Xcode 26 or later"
            exit 1
          fi

      - name: Test portable Swift core
        run: swift test --package-path ios/Core

      - name: Build Release iPhone app for a generic simulator
        run: >-
          xcodebuild
          -project ios/Beanstalk.xcodeproj
          -scheme Beanstalk
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

  android:
    name: android sideload apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event.pull_request.draft != true
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: food-recall-app/package-lock.json

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # ubuntu-latest already ships an Android SDK. The setup-android action
      # still requests the retired `tools` package and fails. Accept licenses
      # so Gradle can install compileSdk 36 if the image is missing it.
      - name: Accept Android SDK licenses
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk_root" ]; then
            echo "::error::ANDROID_HOME is not set on this runner"
            exit 1
          fi
          sdkmanager=$(find "$sdk_root" -path '*cmdline-tools/*/bin/sdkmanager' | sort | tail -n 1)
          if [ ! -x "$sdkmanager" ]; then
            echo "::error::sdkmanager not found under $sdk_root"
            exit 1
          fi
          yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null || true

      - name: Install web dependencies
        working-directory: food-recall-app
        run: npm ci

      - name: Build web assets at origin root and sync Capacitor
        working-directory: food-recall-app
        run: npm run build:android

      - name: Assemble debug APK
        working-directory: android-apk
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload sideload APK
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: beanstalk-debug-apk
          path: android-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  pr:
    name: pull request hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Title follows Conventional Commits
        working-directory: .
        run: |
          echo "Title: $TITLE"
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|chore|ci|revert)(\(.+\))?!?: .+'; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat: add recall filters'"
            exit 1
          fi

      - name: Body references an issue and has a Summary
        # Dependabot supplies its own release-note body; dependency bumps need no issue.
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        working-directory: .
        run: |
          gh pr view "$PR" --json body -q .body > body.md
          if ! grep -Eqi '\b(closes|fixes|resolves)\b[[:space:]]+#[0-9]+' body.md; then
            echo "::error::PR body must reference the issue it closes, e.g. 'Closes #12'"
            exit 1
          fi
          grep -q '## Summary' body.md || echo "::warning::PR body has no '## Summary' section (see the pull request template)"

      - name: Label by changed files
        working-directory: .
        run: |
          gh pr view "$PR" --json files -q '.files[].path' > files.txt
          if grep -q '^food-recall-app/src/' files.txt; then gh pr edit "$PR" --add-label enhancement; fi
          if grep -Eq '\.md$' files.txt;              then gh pr edit "$PR" --add-label docs; fi
          if grep -q '^\.github/' files.txt;          then gh pr edit "$PR" --add-label ci; fi

      - name: CODEOWNERS is valid
        working-directory: .
        # GitHub parses CODEOWNERS itself and reports problems through this
        # endpoint — no third-party validator needed.
        run: |
          errors=$(gh api "repos/${GITHUB_REPOSITORY}/codeowners/errors" --jq '.errors | length')
          if [ "$errors" != "0" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/codeowners/errors" --jq '.errors[] | "::error file=\(.path),line=\(.line)::\(.message)"'
            exit 1
          fi
          echo "CODEOWNERS: no errors"

      - name: No hardcoded secrets in the diff
        working-directory: .
        # Belt-and-braces alongside GitHub secret scanning. Looks for
        # key=value assignments with a long quoted literal on the right; the
        # exclusions keep workflow references to GITHUB_TOKEN out of it.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Match credential-shaped quoted literals. Requiring at least 20
          # base64/hex-style characters avoids flagging fixtures such as
          # `deviceToken: "not-a-token"` while still catching usable secrets.
          pat="(api[_-]?key|secret|password|token)[[:space:]]*[=:][[:space:]]*[\"'][A-Za-z0-9_+/=-]{20,}[\"']"
          if git diff "origin/${BASE_REF}...HEAD" \
              | grep '^+' \
              | grep -viE 'secrets\.GITHUB_TOKEN|github\.token|GH_TOKEN|GITHUB_TOKEN' \
              | grep -iE "$pat"; then
            echo "::error::Possible hardcoded secret in the diff"
            exit 1
          fi
          echo "No hardcoded secrets detected"

          key_header='-----BEGIN '
          key_suffix='(OPENSSH |RSA |EC |ENCRYPTED )?PRIVATE KEY-----'
          if git diff "origin/${BASE_REF}...HEAD" \
              | grep '^+' \
              | grep -v '^+++' \
              | grep -E -- "${key_header}${key_suffix}"; then
            echo "::error::Private-key material found in the diff"
            exit 1
          fi
          echo "No private-key material detected"
