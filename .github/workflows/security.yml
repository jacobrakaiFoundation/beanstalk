name: Security

# CodeQL and dependency review, via the organization's reusable workflow in
# jacobrakaiFoundation/.github. This is the adoption block from that repo's
# docs/MONITORING.md, which names beanstalk as a caller.
#
# The weekly schedule matters as much as the scan: a dependency that becomes
# vulnerable after the last commit is not surfaced until something runs.
#
# Permissions are granted here at the caller's level — a reusable workflow can
# lower them but never raise them — so `security-events: write` must appear
# here or CodeQL cannot upload results.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 6 * * 1" # 06:17 UTC Mondays

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  scan:
    if: github.event.pull_request.draft != true
    uses: jacobrakaiFoundation/.github/.github/workflows/security-scan.yml@main
    with:
      codeql-languages: '["javascript-typescript"]'
      codeql-build-mode: none

  android-codeql:
    name: CodeQL (java-kotlin)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6.3.0

      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build Android app for CodeQL
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: /language:java-kotlin
